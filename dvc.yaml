stages:
  fetch:
    cmd: python -m bank_propensity_pipeline.data.fetch
    deps:
      - src/bank_propensity_pipeline/data/fetch.py
    params:
      - data.source_url
    outs:
      - data/raw/bank-additional-full.csv

  preprocess:
    cmd: python -m bank_propensity_pipeline.data.preprocess
    deps:
      - data/raw/bank-additional-full.csv
      - src/bank_propensity_pipeline/data/preprocess.py
      - src/bank_propensity_pipeline/data/schema.py
    params:
      - seed
      - data.test_size
    outs:
      - data/processed

  
  train:
    cmd: python -m bank_propensity_pipeline.models.train
    deps:
      - data/processed
      - src/bank_propensity_pipeline/features/build.py
      - src/bank_propensity_pipeline/models/train.py
      - src/bank_propensity_pipeline/models/tracking.py
    params:
      - seed
      - model
      - train
    outs:
      - models/model.joblib
    metrics:
      - metrics/train.json:
          cache: false
