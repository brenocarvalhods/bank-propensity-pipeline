seed: 42

data:
  source_url: https://archive.ics.uci.edu/static/public/222/bank+marketing.zip
  raw_path: data/raw/bank-additional-full.csv
  processed_dir: data/processed
  test_size: 0.2
  
model:
  type: logreg
  logreg:
    C: 1.0
    max_iter: 1000
  rf:
    n_estimators: 300
    max_depth: 10
    min_samples_leaf: 5
  hgb:
    learning_rate: 0.1
    max_iter: 300
    max_leaf_nodes: 31
    
train:
  cv_folds: 5
